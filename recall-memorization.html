<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Sentence Memorization</title>
<style>
  :root{
    --bg: #f7f3ea;
    --bg-soft: #efe9db;
    --card: #fffdf8;
    --ink: #2b2620;
    --ink-dim: #6e6656;
    --rule: #ddd3bd;
    --accent: #b5652d;
    --accent-soft: #e8d3c0;
    --success: #4f7a52;
    --shadow: rgba(43, 38, 32, 0.10);
    --focus: #b5652d;
  }
  [data-theme="dark"]{
    --bg: #17161a;
    --bg-soft: #1f1e23;
    --card: #201f24;
    --ink: #e9e4d8;
    --ink-dim: #9b9587;
    --rule: #38363d;
    --accent: #d98f4a;
    --accent-soft: #3a2e22;
    --success: #7cb87f;
    --shadow: rgba(0, 0, 0, 0.35);
    --focus: #d98f4a;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    transition: background 0.3s ease, color 0.3s ease;
    padding: 28px 16px 80px;
  }

  .wrap{
    max-width: 760px;
    margin: 0 auto;
  }

  header{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }

  h1{
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
  }
  h1 .accent-dot{
    color: var(--accent);
  }

  .tagline{
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 4px 0 26px;
  }

  .theme-toggle{
    background: none;
    border: 1px solid var(--rule);
    border-radius: 20px;
    color: var(--ink);
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .theme-toggle:hover{
    border-color: var(--accent);
  }

  .card{
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 6px 24px var(--shadow);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  label.field-label{
    display: block;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }

  textarea#text-input{
    width: 100%;
    min-height: 160px;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 1.05rem;
    line-height: 1.6;
    padding: 14px 16px;
    resize: vertical;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  textarea#text-input:focus{
    outline: none;
    border-color: var(--focus);
  }
  textarea#text-input:disabled{
    opacity: 0.55;
    cursor: not-allowed;
  }

  .input-meta{
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    color: var(--ink-dim);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  .btn-row{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }

  button.btn{
    font-family: 'Courier New', monospace;
    font-size: 0.76rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 7px;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    padding: 11px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.btn:hover:not(:disabled){
    border-color: var(--accent);
    color: var(--accent);
  }
  button.btn.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff8ee;
  }
  button.btn.primary:hover:not(:disabled){
    background: var(--accent);
    filter: brightness(1.08);
    color: #fff8ee;
  }
  button.btn:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }
  button.btn:focus-visible, textarea:focus-visible, .theme-toggle:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---- Game view ---- */
  #game-view{ display: none; }

  .reveal-text{
    font-size: clamp(1.15rem, 2.4vw, 1.45rem);
    line-height: 2.1;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .word-slot{
    display: inline-block;
  }
  .word-slot .blank{
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }
  .word-slot .revealed{
    color: var(--ink);
    animation: reveal-pop 0.3s ease;
  }
  @keyframes reveal-pop{
    from{ opacity: 0; transform: translateY(3px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .word-slot.current .blank{
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
  }

  /* ---- Progress ---- */
  .progress-block{
    margin-top: 22px;
  }
  .progress-numbers{
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .progress-numbers strong{
    color: var(--ink);
  }
  .progress-bar-track{
    height: 8px;
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-bar-fill{
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.35s cubic-bezier(.4,.2,.2,1);
  }

  .complete-banner{
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--success);
    margin-top: 16px;
    min-height: 1.2em;
  }

  /* ---- Stats ---- */
  .stats-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px;
  }
  .stat{
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .stat .stat-label{
    font-family: 'Courier New', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }
  .stat .stat-value{
    font-size: 1.3rem;
    font-family: Georgia, serif;
  }

  .shortcuts-note{
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    color: var(--ink-dim);
    line-height: 1.8;
    margin-top: 4px;
  }
  .shortcuts-note kbd{
    background: var(--bg-soft);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'Courier New', monospace;
  }

  .card-title{
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 14px;
  }

  @media (max-width: 480px){
    .card{ padding: 18px; }
    button.btn{ flex: 1 1 auto; text-align: center; }
  }
</style>
</head>
<body data-theme="light">

<div class="wrap">
  <header>
    <div>
      <h1>Recall<span class="accent-dot">.</span></h1>
      <div class="tagline">Sentence memorization — self-assessment mode</div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">☾ Dark</button>
  </header>

  <!-- Input card -->
  <section class="card" id="input-card" aria-label="Text input">
    <label class="field-label" for="text-input">Text to memorize</label>
    <textarea id="text-input" placeholder="Paste or type the text you want to memorize. Multiple sentences and paragraphs are supported." aria-describedby="input-meta"></textarea>
    <div class="input-meta" id="input-meta">
      <span id="live-word-count">0 words</span>
      <span id="live-char-count">0 characters</span>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="start-btn" disabled>Start Game</button>
      <button class="btn" id="copy-original-btn" disabled>Copy Original Text</button>
    </div>
    <div class="shortcuts-note">
      <kbd>Ctrl</kbd>+<kbd>Enter</kbd> Start &nbsp;·&nbsp;
      <kbd>Space</kbd> Next word &nbsp;·&nbsp;
      <kbd>←</kbd> Previous word &nbsp;·&nbsp;
      <kbd>R</kbd> Reveal all &nbsp;·&nbsp;
      <kbd>Esc</kbd> Reset
    </div>
  </section>

  <!-- Game view -->
  <section id="game-view">
    <section class="card" aria-label="Memorization text">
      <p class="card-title">Your text</p>
      <div class="reveal-text" id="reveal-text" role="text" aria-live="polite"></div>

      <div class="progress-block">
        <div class="progress-numbers">
          <span>Words: <strong id="stat-total">0</strong></span>
          <span>Revealed: <strong id="stat-revealed">0</strong></span>
          <span>Remaining: <strong id="stat-remaining">0</strong></span>
          <span>Progress: <strong id="stat-percent">0%</strong></span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="complete-banner" id="complete-banner"></div>

      <div class="btn-row">
        <button class="btn" id="prev-btn" disabled>◂ Previous Word</button>
        <button class="btn primary" id="next-btn">Next Word ▸</button>
        <button class="btn" id="reveal-all-btn">Reveal All</button>
        <button class="btn" id="copy-view-btn">Copy Current View</button>
        <button class="btn" id="reset-btn">Reset</button>
      </div>
    </section>

    <section class="card" aria-label="Session statistics">
      <p class="card-title">Statistics</p>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">Paragraphs</div>
          <div class="stat-value" id="stat-paragraphs">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Sentences</div>
          <div class="stat-value" id="stat-sentences">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Words</div>
          <div class="stat-value" id="stat-words-total">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Characters</div>
          <div class="stat-value" id="stat-chars">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Session time</div>
          <div class="stat-value" id="stat-timer">00:00</div>
        </div>
      </div>
    </section>
  </section>
</div>

<script>
(function(){
  'use strict';

  /* =========================================================
     State
  ========================================================= */
  const state = {
    tokens: [],          // array of { type: 'word'|'other', text: string }
    wordIndices: [],     // indices into tokens[] that are actual words
    revealedCount: 0,    // how many words are currently revealed
    timerStart: null,
    timerInterval: null,
    sentenceCount: 0,
    paragraphCount: 0
  };

  /* =========================================================
     Element references
  ========================================================= */
  const el = {
    body: document.body,
    themeToggle: document.getElementById('theme-toggle'),
    inputCard: document.getElementById('input-card'),
    textInput: document.getElementById('text-input'),
    liveWordCount: document.getElementById('live-word-count'),
    liveCharCount: document.getElementById('live-char-count'),
    startBtn: document.getElementById('start-btn'),
    copyOriginalBtn: document.getElementById('copy-original-btn'),
    gameView: document.getElementById('game-view'),
    revealText: document.getElementById('reveal-text'),
    statTotal: document.getElementById('stat-total'),
    statRevealed: document.getElementById('stat-revealed'),
    statRemaining: document.getElementById('stat-remaining'),
    statPercent: document.getElementById('stat-percent'),
    progressFill: document.getElementById('progress-fill'),
    completeBanner: document.getElementById('complete-banner'),
    prevBtn: document.getElementById('prev-btn'),
    nextBtn: document.getElementById('next-btn'),
    revealAllBtn: document.getElementById('reveal-all-btn'),
    copyViewBtn: document.getElementById('copy-view-btn'),
    resetBtn: document.getElementById('reset-btn'),
    statParagraphs: document.getElementById('stat-paragraphs'),
    statSentences: document.getElementById('stat-sentences'),
    statWordsTotal: document.getElementById('stat-words-total'),
    statChars: document.getElementById('stat-chars'),
    statTimer: document.getElementById('stat-timer')
  };

  /* =========================================================
     Theme handling
  ========================================================= */
  function applyTheme(theme){
    el.body.setAttribute('data-theme', theme);
    el.themeToggle.textContent = theme === 'dark' ? '☀ Light' : '☾ Dark';
    localStorage.setItem('recall-theme', theme);
  }

  function initTheme(){
    const saved = localStorage.getItem('recall-theme');
    if(saved){
      applyTheme(saved);
      return;
    }
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }

  el.themeToggle.addEventListener('click', () => {
    const current = el.body.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  /* =========================================================
     Local storage — last entered text
  ========================================================= */
  function saveDraft(){
    localStorage.setItem('recall-draft-text', el.textInput.value);
  }

  function loadDraft(){
    const saved = localStorage.getItem('recall-draft-text');
    if(saved) el.textInput.value = saved;
  }

  /* =========================================================
     Tokenizer
     Splits raw text into tokens, distinguishing "word" tokens
     (letters/numbers) from "other" tokens (whitespace, punctuation,
     newlines) which are always preserved and always visible.
  ========================================================= */
  function tokenize(raw){
    // A "word" is a run of letters/numbers/apostrophes/hyphens (keeps contractions and hyphenated words intact).
    const wordPattern = /[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu;
    const tokens = [];
    let lastIndex = 0;
    let match;

    wordPattern.lastIndex = 0;
    while((match = wordPattern.exec(raw)) !== null){
      if(match.index > lastIndex){
        tokens.push({ type: 'other', text: raw.slice(lastIndex, match.index) });
      }
      tokens.push({ type: 'word', text: match[0] });
      lastIndex = wordPattern.lastIndex;
    }
    if(lastIndex < raw.length){
      tokens.push({ type: 'other', text: raw.slice(lastIndex) });
    }
    return tokens;
  }

  function computeStats(raw, tokens){
    const words = tokens.filter(t => t.type === 'word');
    const paragraphs = raw.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
    const sentenceMatches = raw.match(/[^.!?]+[.!?]+/g);
    const sentenceCount = sentenceMatches ? sentenceMatches.length : (raw.trim() ? 1 : 0);

    return {
      totalWords: words.length,
      totalChars: raw.length,
      paragraphCount: Math.max(paragraphs.length, raw.trim() ? 1 : 0),
      sentenceCount: sentenceCount
    };
  }

  /* =========================================================
     Live counters while typing
  ========================================================= */
  function updateLiveCounters(){
    const raw = el.textInput.value;
    const words = raw.trim() ? raw.trim().split(/\s+/).length : 0;
    el.liveWordCount.textContent = `${words} word${words === 1 ? '' : 's'}`;
    el.liveCharCount.textContent = `${raw.length} character${raw.length === 1 ? '' : 's'}`;
    el.startBtn.disabled = raw.trim().length === 0;
    el.copyOriginalBtn.disabled = raw.trim().length === 0;
    saveDraft();
  }

  el.textInput.addEventListener('input', updateLiveCounters);

  /* =========================================================
     Rendering the hidden / revealed text
  ========================================================= */
  function renderText(){
    let html = '';
    let wordCursor = 0;

    state.tokens.forEach((token) => {
      if(token.type === 'other'){
        html += escapeHtml(token.text);
        return;
      }
      // word token
      const isRevealed = wordCursor < state.revealedCount;
      const isCurrent = wordCursor === state.revealedCount; // next word to reveal
      const blankStr = '_'.repeat(token.text.length);
      const classes = ['word-slot'];
      if(isCurrent) classes.push('current');

      if(isRevealed){
        html += `<span class="${classes.join(' ')}"><span class="revealed">${escapeHtml(token.text)}</span></span>`;
      } else {
        html += `<span class="${classes.join(' ')}"><span class="blank">${blankStr}</span></span>`;
      }
      wordCursor++;
    });

    el.revealText.innerHTML = html;
  }

  function escapeHtml(str){
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  /* =========================================================
     Progress + button states
  ========================================================= */
  function updateProgress(){
    const total = state.wordIndices.length;
    const revealed = state.revealedCount;
    const remaining = total - revealed;
    const percent = total === 0 ? 0 : Math.round((revealed / total) * 100);

    el.statTotal.textContent = total;
    el.statRevealed.textContent = revealed;
    el.statRemaining.textContent = remaining;
    el.statPercent.textContent = `${percent}%`;
    el.progressFill.style.width = `${percent}%`;

    el.prevBtn.disabled = revealed <= 0;
    el.nextBtn.disabled = revealed >= total;
    el.revealAllBtn.disabled = revealed >= total;

    el.completeBanner.textContent = (total > 0 && revealed >= total) ? '✓ Fully Revealed — Session Complete' : '';
  }

  /* =========================================================
     Timer
  ========================================================= */
  function startTimer(){
    state.timerStart = Date.now();
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(updateTimerDisplay, 1000);
    updateTimerDisplay();
  }

  function stopTimer(){
    if(state.timerInterval){
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  function updateTimerDisplay(){
    if(!state.timerStart) return;
    const elapsedSec = Math.floor((Date.now() - state.timerStart) / 1000);
    const mm = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const ss = String(elapsedSec % 60).padStart(2, '0');
    el.statTimer.textContent = `${mm}:${ss}`;
  }

  /* =========================================================
     Game control actions
  ========================================================= */
  function startGame(){
    const raw = el.textInput.value;
    if(!raw.trim()) return;

    state.tokens = tokenize(raw);
    state.wordIndices = state.tokens
      .map((t, i) => t.type === 'word' ? i : -1)
      .filter(i => i !== -1);
    state.revealedCount = 0;

    const stats = computeStats(raw, state.tokens);
    el.statParagraphs.textContent = stats.paragraphCount;
    el.statSentences.textContent = stats.sentenceCount;
    el.statWordsTotal.textContent = stats.totalWords;
    el.statChars.textContent = stats.totalChars;

    el.textInput.disabled = true;
    el.inputCard.style.display = 'none';
    el.gameView.style.display = 'block';

    renderText();
    updateProgress();
    startTimer();
  }

  function nextWord(){
    if(state.revealedCount >= state.wordIndices.length) return;
    state.revealedCount++;
    renderText();
    updateProgress();
  }

  function prevWord(){
    if(state.revealedCount <= 0) return;
    state.revealedCount--;
    renderText();
    updateProgress();
  }

  function revealAll(){
    state.revealedCount = state.wordIndices.length;
    renderText();
    updateProgress();
  }

  function resetGame(){
    stopTimer();
    state.tokens = [];
    state.wordIndices = [];
    state.revealedCount = 0;
    state.timerStart = null;

    el.textInput.disabled = false;
    el.inputCard.style.display = 'block';
    el.gameView.style.display = 'none';
    el.statTimer.textContent = '00:00';
    el.completeBanner.textContent = '';

    updateLiveCounters();
    el.textInput.focus();
  }

  /* =========================================================
     Copy actions
  ========================================================= */
  function buildCurrentViewText(){
    let out = '';
    let wordCursor = 0;
    state.tokens.forEach((token) => {
      if(token.type === 'other'){
        out += token.text;
        return;
      }
      const isRevealed = wordCursor < state.revealedCount;
      out += isRevealed ? token.text : '_'.repeat(token.text.length);
      wordCursor++;
    });
    return out;
  }

  async function copyToClipboard(text, btn){
    try{
      await navigator.clipboard.writeText(text);
      flashButton(btn, 'Copied ✓');
    } catch(err){
      // Fallback for environments without clipboard API access
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); flashButton(btn, 'Copied ✓'); }
      catch(e){ flashButton(btn, 'Copy failed'); }
      document.body.removeChild(ta);
    }
  }

  function flashButton(btn, message){
    const original = btn.textContent;
    btn.textContent = message;
    setTimeout(() => { btn.textContent = original; }, 1200);
  }

  /* =========================================================
     Event wiring
  ========================================================= */
  el.startBtn.addEventListener('click', startGame);
  el.nextBtn.addEventListener('click', nextWord);
  el.prevBtn.addEventListener('click', prevWord);
  el.revealAllBtn.addEventListener('click', revealAll);
  el.resetBtn.addEventListener('click', resetGame);
  el.copyOriginalBtn.addEventListener('click', () => copyToClipboard(el.textInput.value, el.copyOriginalBtn));
  el.copyViewBtn.addEventListener('click', () => copyToClipboard(buildCurrentViewText(), el.copyViewBtn));

  document.addEventListener('keydown', (e) => {
    const gameActive = el.gameView.style.display === 'block';
    const isTextInputFocused = document.activeElement === el.textInput;

    if(e.ctrlKey && e.key === 'Enter'){
      if(!isTextInputFocused) return;
      e.preventDefault();
      startGame();
      return;
    }

    if(!gameActive) return;

    switch(e.key){
      case ' ':
        e.preventDefault();
        nextWord();
        break;
      case 'ArrowLeft':
        e.preventDefault();
        prevWord();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        revealAll();
        break;
      case 'Escape':
        e.preventDefault();
        resetGame();
        break;
    }
  });

  /* =========================================================
     Init
  ========================================================= */
  initTheme();
  loadDraft();
  updateLiveCounters();
})();
</script>

</body>
</html>
