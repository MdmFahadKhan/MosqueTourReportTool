<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev day plan</title>
<script>
  document.documentElement.setAttribute('data-theme',
    window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
</script>
<style>
  :root {
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #12181a;
    --surface: #1a2224;
    --surface-2: #212b2e;
    --border: #2c383b;
    --border-strong: #3a4a4e;
    --text: #e4e9ea;
    --text-secondary: #98a5a8;
    --text-muted: #6b7a7d;
    --accent: #0f6e56;
    --accent-fill: #1d9e75;
    --accent-text: #5dcaa5;
    --danger-text: #e2716b;
    --primary-btn-text: #eafff5;
  }
  :root[data-theme="light"] {
    --bg: #f5f6f5;
    --surface: #ffffff;
    --surface-2: #eef0ee;
    --border: #d8dcd9;
    --border-strong: #c2c8c4;
    --text: #1a2224;
    --text-secondary: #57615f;
    --text-muted: #8b938f;
    --accent: #0f6e56;
    --accent-fill: #0e8a68;
    --accent-text: #0f6e56;
    --danger-text: #b3352f;
    --primary-btn-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
    line-height: 1.5;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .date { font-size: 13px; color: var(--text-muted); }
  .subhead { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 600;
    margin: 0 0 10px;
  }

  .primary-card { border-color: var(--border-strong); }

  input[type="text"], textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 9px 10px;
    margin-bottom: 8px;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-fill);
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); }
  label.field-label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 10px 0 4px;
  }
  label.field-label:first-child { margin-top: 0; }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 6px;
  }
  .task-row input[type="checkbox"] {
    margin-top: 11px;
    width: 16px;
    height: 16px;
    accent-color: var(--accent-fill);
    flex-shrink: 0;
  }
  .task-row input[type="text"] { margin-bottom: 0; }
  .task-row.done input[type="text"] {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  /* Sub-tasks under Primary: checked = bold, never struck-through */
  .subtask-block { margin-top: 12px; }
  .subtask-row.done input[type="text"] {
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
  }

  textarea.blockers { min-height: 56px; }

  .btn {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--primary-btn-text);
  }
  .btn.primary:hover { background: var(--accent-fill); }
  .btn.ghost { border-color: transparent; color: var(--text-muted); }
  .btn.ghost:hover { color: var(--text-secondary); background: var(--surface-2); }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  .review-grid { display: grid; grid-template-columns: 1fr; gap: 0; }

  footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }

  .status {
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
  }
  .status.saved { color: var(--accent-text); }

  .yesterday-note {
    font-size: 13px;
    background: var(--surface-2);
    border-left: 2px solid var(--accent-fill);
    padding: 8px 12px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 16px;
    color: var(--text-secondary);
  }
  .yesterday-note strong { color: var(--text); font-weight: 600; }

  .history-toggle {
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    margin-top: 24px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .history-list { margin-top: 12px; display: none; }
  .history-list.open { display: block; }
  .history-item {
    font-size: 12px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  .history-item .h-date { color: var(--text); font-weight: 600; margin-bottom: 3px; }

  .theme-toggle {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    line-height: 1;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dev day plan</h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="date" id="today-date"></span>
      <button class="theme-toggle" id="theme-toggle" type="button">Light mode</button>
    </div>
  </header>
  <p class="subhead">Fill this before opening the IDE. Takes 5 minutes.</p>

  <div id="yesterday-note-slot"></div>

  <div class="card primary-card">
    <p class="card-label">Primary — must ship today</p>
    <input type="text" id="primary-task" placeholder="e.g. fix null ref in PDC cheque validation">
    <label class="field-label">Definition of done</label>
    <input type="text" id="primary-done" placeholder="e.g. validation handles null dates without throwing">

    <div class="subtask-block">
      <label class="field-label">Sub-tasks</label>
      <div id="primary-subtask-list"></div>
      <button class="btn ghost" id="add-primary-subtask" type="button">+ Add sub-task</button>
    </div>
  </div>

  <div class="card">
    <p class="card-label">Secondary — if time allows</p>
    <div id="secondary-list"></div>
    <button class="btn ghost" id="add-secondary" type="button">+ Add secondary task</button>
  </div>

  <div class="card">
    <p class="card-label">Known blockers / waiting on</p>
    <textarea class="blockers" id="blockers" placeholder="e.g. waiting on DBA for Oracle schema access"></textarea>
  </div>

  <div class="card">
    <p class="card-label">First 90 minutes — be specific</p>
    <textarea id="first-90" placeholder="Exactly what you'll open and do the moment you sit down." style="min-height: 44px;"></textarea>
  </div>

  <div class="card">
    <p class="card-label">End-of-day review</p>
    <label class="field-label">What shipped</label>
    <input type="text" id="shipped" placeholder="What actually got done today">
    <label class="field-label">What's blocked</label>
    <input type="text" id="stuck" placeholder="What didn't move and why">
    <label class="field-label">Tomorrow's first task</label>
    <input type="text" id="tomorrow" placeholder="Carries forward to tomorrow's plan automatically">
  </div>

  <div style="display:flex; justify-content: space-between; align-items: center; gap: 12px;">
    <button class="btn primary" id="save-btn" type="button">Save today's plan</button>
    <span class="status" id="status"></span>
  </div>

  <div class="history-toggle" id="history-toggle">View past days</div>
  <div class="history-list" id="history-list"></div>

</div>

<script>
const todayKey = () => {
  const d = new Date();
  return d.toISOString().slice(0, 10);
};

const todayStr = () => {
  return new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
};

// Storage shim: localStorage, wrapped to match the async get/set shape used below.
const store = {
  async get(key) {
    const v = localStorage.getItem('devplan:' + key);
    return v === null ? null : { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem('devplan:' + key, value);
    return { key, value };
  }
};

document.getElementById('today-date').textContent = todayStr();

let secondaryCount = 0;
let primarySubCount = 0;

function addSecondaryRow(text = '', done = false) {
  const id = 'sec-' + (secondaryCount++);
  const list = document.getElementById('secondary-list');
  const row = document.createElement('div');
  row.className = 'task-row' + (done ? ' done' : '');
  row.dataset.id = id;
  row.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''}>
    <input type="text" placeholder="Secondary task" value="${text.replace(/"/g, '&quot;')}">
    <button class="btn ghost" style="padding:6px 8px;" type="button" aria-label="Remove task"><i>&times;</i></button>
  `;
  const checkbox = row.querySelector('input[type="checkbox"]');
  checkbox.addEventListener('change', () => {
    row.classList.toggle('done', checkbox.checked);
  });
  row.querySelector('button').addEventListener('click', () => row.remove());
  list.appendChild(row);
}

// Primary sub-tasks: checked items are bolded (never struck through)
function addPrimarySubtaskRow(text = '', done = false) {
  const id = 'psub-' + (primarySubCount++);
  const list = document.getElementById('primary-subtask-list');
  const row = document.createElement('div');
  row.className = 'task-row subtask-row' + (done ? ' done' : '');
  row.dataset.id = id;
  row.innerHTML = `
    <input type="checkbox" ${done ? 'checked' : ''}>
    <input type="text" placeholder="Sub-task" value="${text.replace(/"/g, '&quot;')}">
    <button class="btn ghost" style="padding:6px 8px;" type="button" aria-label="Remove sub-task"><i>&times;</i></button>
  `;
  const checkbox = row.querySelector('input[type="checkbox"]');
  checkbox.addEventListener('change', () => {
    row.classList.toggle('done', checkbox.checked);
  });
  row.querySelector('button').addEventListener('click', () => row.remove());
  list.appendChild(row);
}

document.getElementById('add-secondary').addEventListener('click', () => addSecondaryRow());
document.getElementById('add-primary-subtask').addEventListener('click', () => addPrimarySubtaskRow());

function collectSecondary() {
  return Array.from(document.querySelectorAll('#secondary-list .task-row')).map(row => ({
    text: row.querySelector('input[type="text"]').value,
    done: row.querySelector('input[type="checkbox"]').checked
  })).filter(t => t.text.trim() !== '');
}

function collectPrimarySubtasks() {
  return Array.from(document.querySelectorAll('#primary-subtask-list .task-row')).map(row => ({
    text: row.querySelector('input[type="text"]').value,
    done: row.querySelector('input[type="checkbox"]').checked
  })).filter(t => t.text.trim() !== '');
}

async function loadYesterdayCarry() {
  try {
    const idx = await store.get('plan-index');
    if (!idx) return;
    const dates = JSON.parse(idx.value).sort().reverse();
    const prevDate = dates.find(d => d !== todayKey());
    if (!prevDate) return;
    const prev = await store.get('plan:' + prevDate);
    if (!prev) return;
    const data = JSON.parse(prev.value);
    if (data.tomorrow && data.tomorrow.trim()) {
      const slot = document.getElementById('yesterday-note-slot');
      slot.innerHTML = `<div class="yesterday-note">Carried from ${prevDate}: <strong>${data.tomorrow}</strong></div>`;
      if (!document.getElementById('primary-task').value) {
        document.getElementById('primary-task').value = data.tomorrow;
      }
    }
  } catch (e) {
    // no prior days yet
  }
}

async function loadToday() {
  try {
    const res = await store.get('plan:' + todayKey());
    if (!res) return;
    const data = JSON.parse(res.value);
    document.getElementById('primary-task').value = data.primaryTask || '';
    document.getElementById('primary-done').value = data.primaryDone || '';
    document.getElementById('blockers').value = data.blockers || '';
    document.getElementById('first-90').value = data.first90 || '';
    document.getElementById('shipped').value = data.shipped || '';
    document.getElementById('stuck').value = data.stuck || '';
    document.getElementById('tomorrow').value = data.tomorrow || '';
    (data.secondary || []).forEach(t => addSecondaryRow(t.text, t.done));
    (data.primarySubtasks || []).forEach(t => addPrimarySubtaskRow(t.text, t.done));
  } catch (e) {
    // nothing saved yet today
  }
}

async function saveToday() {
  const statusEl = document.getElementById('status');
  const data = {
    primaryTask: document.getElementById('primary-task').value,
    primaryDone: document.getElementById('primary-done').value,
    primarySubtasks: collectPrimarySubtasks(),
    secondary: collectSecondary(),
    blockers: document.getElementById('blockers').value,
    first90: document.getElementById('first-90').value,
    shipped: document.getElementById('shipped').value,
    stuck: document.getElementById('stuck').value,
    tomorrow: document.getElementById('tomorrow').value
  };
  try {
    await store.set('plan:' + todayKey(), JSON.stringify(data));
    let idxSet = new Set();
    try {
      const idx = await store.get('plan-index');
      if (idx) idxSet = new Set(JSON.parse(idx.value));
    } catch (e) {}
    idxSet.add(todayKey());
    await store.set('plan-index', JSON.stringify(Array.from(idxSet)));
    statusEl.textContent = 'Saved';
    statusEl.classList.add('saved');
    setTimeout(() => { statusEl.textContent = ''; statusEl.classList.remove('saved'); }, 2000);
  } catch (e) {
    statusEl.textContent = 'Save failed — try again';
    statusEl.classList.remove('saved');
  }
}

document.getElementById('save-btn').addEventListener('click', saveToday);

async function renderHistory() {
  const listEl = document.getElementById('history-list');
  try {
    const idx = await store.get('plan-index');
    if (!idx) { listEl.innerHTML = '<div class="history-item">No past days yet.</div>'; return; }
    const dates = JSON.parse(idx.value).filter(d => d !== todayKey()).sort().reverse();
    if (dates.length === 0) { listEl.innerHTML = '<div class="history-item">No past days yet.</div>'; return; }
    listEl.innerHTML = '';
    for (const d of dates) {
      try {
        const res = await store.get('plan:' + d);
        const data = JSON.parse(res.value);
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `<div class="h-date">${d}</div>
          Primary: ${data.primaryTask || '—'}<br>
          Shipped: ${data.shipped || '—'}<br>
          Blocked: ${data.stuck || '—'}`;
        listEl.appendChild(item);
      } catch (e) {}
    }
  } catch (e) {
    listEl.innerHTML = '<div class="history-item">No past days yet.</div>';
  }
}

document.getElementById('history-toggle').addEventListener('click', async () => {
  const listEl = document.getElementById('history-list');
  const open = listEl.classList.toggle('open');
  if (open) await renderHistory();
});

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('theme-toggle');
  btn.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
}

async function initTheme() {
  let theme = null;
  try {
    const res = await store.get('theme');
    if (res) theme = res.value;
  } catch (e) {}
  if (!theme) {
    theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  applyTheme(theme);
}

document.getElementById('theme-toggle').addEventListener('click', async () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try {
    await store.set('theme', next);
  } catch (e) {}
});

(async function init() {
  await initTheme();
  await loadYesterdayCarry();
  await loadToday();
  if (document.querySelectorAll('#secondary-list .task-row').length === 0) {
    addSecondaryRow();
  }
})();
</script>
</body>
</html>
